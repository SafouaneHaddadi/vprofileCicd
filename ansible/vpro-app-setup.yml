- name: Setup Tomcat8 & Deploy Artifact
  hosts: appsrvgrp #Le fichier est destiné à être exécuté sur les serveurs appartenant au groupe appsrvgrp
  become: yes # permet d executer les taches avec les privileges root

  vars:
    timestamp: "{{ansible_date_time.date}}_{{ansible_date_time.hour}}_{{ansible_date_time.minute}}"  #backup

  tasks:
    # Téléchargement du .war depuis Nexus
    - name: Download latest VProfile.war from nexus
      get_url:
        url:  "http://{{USER}}:{{PASS}}@{{nexusip}}:8081/repository/{{reponame}}/{{groupid}}/{{artifactid}}/{{build}}-{{time}}/{{vprofile_version}}" #url de notre artefact sur Nexus
        dest: "/tmp/vproapp-{{vprofile_version}}"
      register: wardeploy #on enregistre le resultat de cette tache
      tags:
       - deploy

#Vérifie si le répertoire ROOT existe dans le répertoire webapps de Tomcat, ce qui indique si une version précédente de l'app est déjà déployée
    - stat: #on recueille des statistiques sur l'artifact actuel
        path: /usr/local/tomcat8/webapps/ROOT
      register: artifact_stat
      tags:
       - deploy

    # Arrêt de Tomcat avant déploiement
    - name: Stop tomcat svc
      service:
        name: tomcat
        state: stopped
      tags:
       - deploy

    # Bloc principal de déploiement avec sauvegarde et rollback
    - name: Try Backup and Deploy
      block:

      # Archive le répertoire actuel ROOT avec timestamp
      - name: Archive ROOT dir with timestamp
        archive:
          path: /usr/local/tomcat8/webapps/ROOT
          dest: "/opt/ROOT_{{timestamp}}.tgz"
        when: artifact_stat.stat.exists # si l artifact existait, on archive le repertoire ROOT avec un nom de fichier unique basé sur le timestamp (backup)
        register: archive_info
        tags:
         - deploy

      # copie le répertoire ROOT sous le nom old_ROOT pour le garder en tant que copie de sauvegarde avant de procéder au déploiement du nouvel artefact
      - name: copy ROOT dir with old_ROOT name
        shell: cp -r ROOT old_ROOT
        args:
          chdir: /usr/local/tomcat8/webapps/

      # Supprime l'ancien artefact
      - name: Delete current artifact
        file:
          path: "{{item}}"
          state: absent
        when: archive_info.changed # on supprime les anciens art° uniquement si la sauvegarde a été effectué avec succès
        loop:
         - /usr/local/tomcat8/webapps/ROOT # ce fichier sera supprimé en premier
         - /usr/local/tomcat8/webapps/ROOT.war #ensuite celui ci
        tags:
         - deploy

      # Bloc de déploiement avec rollback automatique si échec
      - name: Try deploy artifact else restore from previos old_ROOT
        block:

         # Copie du nouvel artefact dans ROOT.war
         - name: Deploy vprofile artifact
           copy:
             src: "/tmp/vproapp-{{vprofile_version}}" #notre artefact qui a été téléchargé lors de la premiere tache
             dest: /usr/local/tomcat8/webapps/ROOT.war
             remote_src: yes
           register: deploy_info
           tags:
            - deploy
        rescue: #si la copie échoue, on restaure old_ROOT -> instant rollback
          - shell: cp -r old_ROOT ROOT
            args:
              chdir: /usr/local/tomcat8/webapps/

                #-> Main block

      rescue: #si la tache précédente échoue 
       # Redémarre tomcat même en cas d’échec
       - name: Start tomcat svc
         service:
          name: tomcat
          state: started

    # Redémarrage de Tomcat seulement si le déploiement a modifié quelque chose
    - name: Start tomcat svc
      service:
        name: tomcat
        state: started
      when: deploy_info.changed
      tags:
       - deploy

    # Attend que le déploiement soit terminé (que ROOT soit extrait)
    - name: Wait until ROOT.war is extracted to ROOT directory
      wait_for:
        path: /usr/local/tomcat8/webapps/ROOT.war

   
  handlers : 
    - name: Restart tomcat
      service:
        name: tomcat
        state: restarted
#  tt ceci permet d'assurer un déploiement contrôlé et sécurisé avec une option de restauration en cas d'échec